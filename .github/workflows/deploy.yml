# ============================================================
# Publicacion automatica en GitHub Pages
# ------------------------------------------------------------
# Cada vez que hagas "git push" a la rama main, GitHub:
#   1. instala las dependencias
#   2. ejecuta "npm run build" (genera la carpeta dist/)
#   3. sube dist/ a GitHub Pages
#
# Requisito (se hace una sola vez, en la web de GitHub):
#   Repositorio -> Settings -> Pages -> "Build and deployment"
#   -> Source: "GitHub Actions"
# ============================================================
name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
